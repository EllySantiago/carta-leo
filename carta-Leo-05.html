<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Leo 05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ecdfb8;
    --paper-dark: #ddc99a;
    --ink: #2b2620;
    --shadow: rgba(90, 70, 30, 0.28);
  }

  *{
    box-sizing: border-box;
  }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    font-family: 'Special Elite', 'Courier New', monospace;
    color: var(--ink);
    background: linear-gradient(160deg, #f7efdc 0%, #f1e7cd 45%, #ecdfc0 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 6vh 20px 8vh;
    min-height: 100vh;
  }

  .sheet-wrap{
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .letter{
    position: relative;
    width: 100%;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,250,220,0.4), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(150,120,60,0.18), transparent 50%),
      linear-gradient(var(--paper), var(--paper-dark));
    padding: 8vw 10vw 8vw;
    box-shadow:
      0 8px 20px var(--shadow),
      0 20px 45px rgba(90,70,30,0.18);
    border-radius: 2px;
    line-height: 1.65;
    font-size: 16.5px;
    min-height: 52vh;
  }

  .letter::before{
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(120,90,40,0.15) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.012) 0px, rgba(0,0,0,0.012) 1px, transparent 1px, transparent 2px);
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  .letter::after{
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 45px rgba(140,110,50,0.22), inset 0 0 10px rgba(0,0,0,0.12);
    pointer-events: none;
  }

  .letter-title{
    position: relative;
    z-index: 1;
    text-align: center;
    font-family: 'MedievalSharp', 'Special Elite', cursive;
    font-size: 1.7em;
    letter-spacing: 1px;
    margin: 0.3em 0 0.2em;
    color: #3a2e1a;
  }

  .flourish{
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    color: rgba(58, 46, 26, 0.55);
    margin: 0 auto 1.5em;
    width: 70%;
  }

  .flourish svg{
    width: 100%;
    height: auto;
    display: block;
  }

  .corner-ornament{
    position: absolute;
    z-index: 1;
    font-size: 1.1em;
    color: rgba(58, 46, 26, 0.35);
    line-height: 1;
  }

  .corner-tl{ top: 14px; left: 16px; }
  .corner-tr{ top: 14px; right: 16px; }
  .corner-bl{ bottom: 14px; left: 16px; }
  .corner-br{ bottom: 14px; right: 16px; }

  .dropcap{
    float: left;
    font-family: 'MedievalSharp', 'Special Elite', cursive;
    font-size: 3.6em;
    line-height: 0.78;
    padding: 0.02em 0.08em 0 0;
    color: #3a2e1a;
  }

  .dropcap-p{
    text-align: justify;
    text-justify: inter-word;
  }

  .dropcap-p::after{
    content: "";
    display: table;
    clear: both;
  }

  .ticket{
    margin: 0.6em auto 1.6em;
    max-width: 320px;
    padding: 0.9em 1em;
    border: 1px dashed rgba(58, 46, 26, 0.5);
    border-radius: 3px;
    text-align: center;
    font-size: 0.92em;
    letter-spacing: 0.6px;
    line-height: 1.9;
    background: rgba(255, 250, 230, 0.25);
  }

  .page-seal{
    position: absolute;
    z-index: 1;
    pointer-events: none;
    display: none;
  }

  .page-seal svg{
    display: block;
  }

  .bouquet-seal{
    top: 50px;
    right: 28px;
    width: 78px;
    height: 78px;
    color: rgba(58, 46, 26, 0.55);
  }

  .rose-seal{
    bottom: 60px;
    right: 34px;
    width: 92px;
    height: 92px;
    opacity: 0.72;
    transform: rotate(-14deg);
    mix-blend-mode: multiply;
  }

  .page-seal.visible{
    display: block;
  }

  @media (max-width: 560px){
    .bouquet-seal{
      width: 58px;
      height: 58px;
      top: 40px;
      right: 16px;
    }
    .rose-seal{
      width: 70px;
      height: 70px;
      bottom: 40px;
      right: 18px;
    }
    .ticket{
      font-size: 0.85em;
      max-width: 250px;
    }
  }

  #page-content{
    position: relative;
    z-index: 1;
    min-height: 34vh;
    opacity: 1;
    transition: opacity 0.28s ease;
  }

  #page-content.fade{
    opacity: 0;
  }

  p{
    margin: 0 0 1.2em;
    text-align: justify;
    text-justify: inter-word;
  }

  .poem-quote{
    font-style: italic;
  }

  .poem-plain{
    font-style: normal;
  }

  .pagination{
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1em;
    margin-top: 1.6em;
  }

  .page-arrow{
    background: none;
    border: none;
    color: var(--ink);
    font-size: 1.3em;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    opacity: 0.75;
    transition: opacity 0.15s ease, transform 0.15s ease;
    font-family: 'Special Elite', monospace;
  }

  .page-arrow:hover{
    opacity: 1;
    transform: scale(1.1);
  }

  .page-arrow.disabled{
    opacity: 0.2;
    cursor: default;
    pointer-events: none;
    transform: none;
  }

  .dots{
    display: flex;
    gap: 0.55em;
  }

  .dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.3);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot:hover{
    transform: scale(1.2);
  }

  .dot.active{
    background: var(--ink);
    transform: scale(1.15);
  }

  @media (max-width: 560px){
    .letter{
      font-size: 15px;
      padding: 9vw 8vw 9vw;
    }
    .letter-title{
      font-size: 1.4em;
    }
    .dropcap{
      font-size: 2.8em;
    }
    .corner-ornament{
      font-size: 0.85em;
    }
    .corner-tl, .corner-tr{ top: 10px; }
    .corner-bl, .corner-br{ bottom: 10px; }
    .corner-tl, .corner-bl{ left: 10px; }
    .corner-tr, .corner-br{ right: 10px; }
  }
</style>
</head>
<body>

  <div class="sheet-wrap">
    <div class="letter">
      <div class="corner-ornament corner-tl">&#10086;</div>
      <div class="corner-ornament corner-tr">&#10086;</div>
      <div class="corner-ornament corner-bl">&#10086;</div>
      <div class="corner-ornament corner-br">&#10086;</div>

      <div class="page-seal bouquet-seal" id="bouquet-seal" aria-hidden="true">
        <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
          <circle cx="45" cy="45" r="42" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2 3"/>
          <path d="M45 62 L38 40 Q45 30 52 40 L45 62 Z" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <path d="M32 66 Q45 58 58 66 L56 70 Q45 64 34 70 Z" fill="currentColor" opacity="0.85"/>
          <g stroke="currentColor" stroke-width="1" fill="none">
            <circle cx="34" cy="34" r="5"/>
            <circle cx="45" cy="26" r="5.5"/>
            <circle cx="57" cy="34" r="5"/>
            <circle cx="40" cy="40" r="2.2" fill="currentColor" stroke="none"/>
            <circle cx="51" cy="40" r="2.2" fill="currentColor" stroke="none"/>
            <circle cx="45" cy="31" r="2.2" fill="currentColor" stroke="none"/>
          </g>
          <path d="M45 62 L45 78" stroke="currentColor" stroke-width="1.1"/>
          <path d="M45 68 Q40 66 38 70" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M45 72 Q50 70 52 74" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </div>

      <div class="page-seal rose-seal" id="rose-seal" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <g fill="#8a1f1f">
            <path d="M50 20 C 40 22, 34 30, 38 38 C 30 36, 24 42, 28 50 C 20 50, 18 58, 26 62 C 20 68, 24 76, 32 74 C 32 82, 40 84, 44 78 C 48 84, 58 82, 58 74 C 66 78, 72 70, 66 64 C 74 62, 74 52, 66 50 C 72 44, 66 36, 58 38 C 60 30, 54 22, 50 20 Z" opacity="0.9"/>
            <path d="M50 30 C 45 32, 42 38, 46 42 C 40 42, 38 48, 44 52 C 38 54, 38 60, 44 62 C 40 66, 44 72, 50 70 C 52 74, 58 74, 58 68 C 64 70, 68 64, 62 60 C 68 58, 66 52, 60 52 C 66 48, 62 42, 56 44 C 58 38, 54 32, 50 30 Z" opacity="0.95"/>
            <circle cx="50" cy="52" r="7" opacity="1"/>
          </g>
          <g stroke="#5c1414" stroke-width="0.8" fill="none" opacity="0.5">
            <path d="M50 20 C 40 22, 34 30, 38 38"/>
            <path d="M66 50 C 74 44, 66 36, 58 38"/>
            <path d="M32 74 C 32 82, 40 84, 44 78"/>
            <path d="M58 74 C 66 78, 72 70, 66 64"/>
          </g>
        </svg>
      </div>
      <div class="letter-title">Carta Leo 05</div>
      <div class="flourish" aria-hidden="true">
        <svg viewBox="0 0 300 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 13 C 60 13, 90 2, 130 13 C 140 16, 145 4, 150 4 C 155 4, 160 16, 170 13 C 210 2, 240 13, 300 13"
                fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="150" cy="4" r="2.6" fill="currentColor"/>
        </svg>
      </div>
      <div id="page-content"></div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

<script>
  const pages = ["      <p class=\"poem-plain dropcap-p\"><span class=\"dropcap\">E</span>u vou pro cinema amanhã e quero você lá.</p>\n      <div class=\"ticket\">\n        <div>Coyote vs. Acme — sessão das 15:45</div>\n        <div>Assento J7</div>\n        <div>Shopping Boa Vista</div>\n      </div>", "      <p class=\"poem-plain\">\n        nem adianta por defeito pq esse fica perto e te conhecendo tu vai nem prestar atenção no filme então pode ser um de meu agrado, eu ia chamar pra homem aranha mas acho que tu já viu(lembro de tu comentar com as meninas da padaria sobre), preguiça de checar isso no baralho, aí também o caba não vive, se for checar tudo tbm.<br>\n        eu vou independente de tu ir ou nao mas se nao aparecer nao falo mais contigo viu, rum.\n      </p>", "      <p class=\"poem-plain\">\n        inclusive, teus amigos já sabem que a menina que tu gosta sou eu, já perceberam faz tempo, ainda pensam que tu finalmente achou a doidinha que te completa kkkkkkkkk<br>\n        quão bem tu fala de uma pessoa que vez ou outra te chama de piranha vei, fico até lisonjeada.<br>\n        eles só não tem certeza, mas saber, já sabem quem é, e sei até pq, eu rindo horrores com isso, muito bom.<br>\n        vejo você lá princesa, e por favor, sai anunciando pra meio mundo não, odeio que saibam aonde vou, tu eu ainda digo pq gosto de você Leo.\n      </p>", "      <p class=\"poem-plain\">\n        Leva toda brincadeira minha a serio nao visse<br>\n        beijos minha princesa, gosto de tu piranha S2<br>\n        eu ate ia por assinado satanás mas vou nao<br>\n        ass: A musa de sua vida\n      </p>"];

  let current = 0;
  const contentEl = document.getElementById('page-content');
  const paginationEl = document.getElementById('pagination');

  function buildPagination(){
    paginationEl.innerHTML = '';

    const prev = document.createElement('button');
    prev.className = 'page-arrow';
    prev.innerHTML = '&#8249;';
    prev.setAttribute('aria-label', 'Página anterior');
    prev.addEventListener('click', () => {
      if (current > 0){ current--; renderPage(); }
    });
    paginationEl.appendChild(prev);

    const dotsWrap = document.createElement('div');
    dotsWrap.className = 'dots';
    pages.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === current ? ' active' : '');
      dot.addEventListener('click', () => { current = i; renderPage(); });
      dotsWrap.appendChild(dot);
    });
    paginationEl.appendChild(dotsWrap);

    const next = document.createElement('button');
    next.className = 'page-arrow';
    next.innerHTML = '&#8250;';
    next.setAttribute('aria-label', 'Próxima página');
    next.addEventListener('click', () => {
      if (current < pages.length - 1){ current++; renderPage(); }
    });
    paginationEl.appendChild(next);

    prev.classList.toggle('disabled', current === 0);
    next.classList.toggle('disabled', current === pages.length - 1);
  }

  function renderPage(){
    contentEl.classList.add('fade');
    setTimeout(() => {
      contentEl.innerHTML = pages[current];
      buildPagination();
      updateSeals();
      contentEl.classList.remove('fade');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 180);
  }

  function updateSeals(){
    const bouquet = document.getElementById('bouquet-seal');
    const rose = document.getElementById('rose-seal');
    if (bouquet) bouquet.classList.toggle('visible', current === 0);
    if (rose) rose.classList.toggle('visible', current === pages.length - 1);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' && current < pages.length - 1){ current++; renderPage(); }
    if (e.key === 'ArrowLeft' && current > 0){ current--; renderPage(); }
  });

  // initial render (no fade delay needed)
  contentEl.innerHTML = pages[current];
  buildPagination();
  updateSeals();
</script>

</body>
</html>
